<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Popovers</title>
</head>
<body>
  <div class="container">
    <button
      type="button"
      class="btn"
      data-popover-title="Popover title"
      data-popover-content="And here's some amazing content. It's very engaging. Right?"
    >
      Click to toggle popover
    </button>

    <button
      type="button"
      class="btn"
      data-popover-title="Второй Popover"
      data-popover-content="Это второй триггер для проверки, что виджет поддерживает несколько элементов."
    >
      Ещё одна кнопка
    </button>

    <button
      type="button"
      class="btn"
      data-popover-title="Справка"
      data-popover-content="Popover всегда показывается над элементом и центрируется по горизонтали."
    >
      Помощь
    </button>
  </div>
</body>
</html>
